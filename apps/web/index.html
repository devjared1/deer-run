<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The build replaces this title and description with each page's head tags (canonical, Open Graph, JSON-LD:
         src/lib/seo.js via scripts/prerender.mjs); in the browser App.vue's useHead keeps them up to date -->
    <title>Deer Run Golf Course — Moulton, Alabama</title>

    <meta name="theme-color" content="#1E3D2F" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Fonts are self-hosted (@fontsource, imported in src/main.js); the build preloads Playfair 700 and Lato 400 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
